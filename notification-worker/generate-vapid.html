<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAPID 金鑰產生器</title>
<style>
  body{max-width:720px;margin:40px auto;padding:0 20px;background:#101014;color:#fff;font:16px system-ui;line-height:1.6}
  button{padding:12px 18px;border:0;border-radius:12px;background:#3b82f6;color:#fff;font-weight:700;cursor:pointer}
  label{display:block;margin-top:20px;color:#aaa}textarea{box-sizing:border-box;width:100%;min-height:100px;padding:12px;border:1px solid #444;border-radius:12px;background:#1c1c21;color:#fff;word-break:break-all}
  .warning{color:#fbbf24}
</style>
<h1>VAPID 金鑰產生器</h1>
<p>此頁只在你的瀏覽器本機產生金鑰，不會傳送資料。</p>
<p class="warning">Private Key 是秘密，請勿上傳 GitHub 或傳給別人。</p>
<button id="generate">產生新金鑰</button>
<label>VAPID_PUBLIC_KEY</label><textarea id="public" readonly></textarea>
<label>VAPID_PRIVATE_KEY</label><textarea id="private" readonly></textarea>
<script>
const toBytes=value=>Uint8Array.from(atob(value.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-value.length%4)%4)),c=>c.charCodeAt(0));
const toBase64Url=bytes=>btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
document.getElementById('generate').onclick=async()=>{
  const pair=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
  const pub=await crypto.subtle.exportKey('jwk',pair.publicKey);
  const priv=await crypto.subtle.exportKey('jwk',pair.privateKey);
  const raw=new Uint8Array(65);raw[0]=4;raw.set(toBytes(pub.x),1);raw.set(toBytes(pub.y),33);
  document.getElementById('public').value=toBase64Url(raw);
  document.getElementById('private').value=priv.d;
};
</script>
</html>
